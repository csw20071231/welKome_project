                            const intro = shop.id === 'shop-oliveyoung'
                              ? '올리브영은 한국의 대표 헬스 & 뷰티 스토어로, 인기 스킨케어·마스크팩·메이크업 제품을 테스트하고 즉시 면세로 구매할 수 있습니다.'
                              : shop.id === 'shop-daiso'
                              ? '다이소는 1,000원~5,000원 균일가로 생활용품, 문구, 한글 기념품, 가성비 화장품을 판매하는 한국 최대 생활용품점입니다.'
                              : shop.id === 'shop-cvs'
                              ? '한국 편의점(CU, GS25)은 24시간 운영되며 K-라면 즉석 조리, 교통카드 충전, 해외카드 ATM까지 이용할 수 있는 생활 허브입니다.'
                              : `${shop.store}는 최신 K-패션 플래그십과 팝업스토어를 한 번에 즐길 수 있는 대표 쇼핑 랜드마크입니다.`;

                            return (
                              <div key={shop.id} className="bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100">
                                <div className="relative h-44 bg-slate-950">
                                  <SafePhoto src={shop.photo} alt={shop.store} className="w-full h-full object-cover" />
                                  <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent" />
                                  <span className="absolute top-2.5 left-2.5 bg-[#1E1B4B]/85 text-white text-[10px] font-extrabold px-2.5 py-1 rounded-full">{shop.brand}</span>
                                  <button
                                    onClick={() => {
                                      setPlayingTrendId(isPlaying ? null : shop.id);
                                      if (!isPlaying) speakPhrase(`${shop.store} 최신 쇼핑 트렌드를 안내해 드릴게요!`);
                                    }}
                                    className="absolute bottom-2.5 left-2.5 bg-rose-600 text-white text-[10px] font-extrabold px-3 py-1.5 rounded-full"
                                  >
                                    {isPlaying ? '⏹ 트렌드 영상 닫기' : '▶ 요즘 트렌드 영상 보기'}
                                  </button>
                                  {isPlaying && (
                                    <div className="absolute inset-x-3 top-11 bg-black/85 border border-rose-400/50 rounded-2xl p-2.5 text-white">
                                      <p className="text-[9px] font-black text-rose-300">● IN-APP K-TREND PREVIEW</p>
                                      <p className="text-[11px] font-bold mt-0.5">{shop.highlights}</p>
                                    </div>
                                  )}
                                </div>
                                <div className="p-3.5 space-y-2">
                                  <h3 className="text-sm font-black text-[#1E1B4B]">{shop.store}</h3>
                                  <p className="text-[11px] text-slate-700 bg-slate-50 p-2.5 rounded-2xl">💡 <b>이곳은 어떤 곳인가요?</b> {intro}</p>
                                  <button onClick={() => openInMap(shop, false, 1)} className="w-full py-2.5 rounded-2xl bg-[#4F46E5] text-white text-xs font-extrabold">
                                    📍 {t.findNearMeBtn}
                                  </button>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {/* AI CHAT TAB */}
                {activeTab === 'chat' && (
                  <div className="pb-24 bg-[#F5F6FC] min-h-full flex flex-col">
                    <div className="bg-gradient-to-r from-[#2E1A78] to-[#4F46E5] text-white px-4 pt-4 pb-4 rounded-b-3xl shadow-md">
                      <h2 className="text-base font-black">welKome AI Travel Concierge</h2>
                      <p className="text-[10px] text-indigo-200">Synced with Map & AI Smart Glasses</p>
                    </div>
                    <div className="p-4 space-y-3 flex-1">
                      <div className="flex gap-1.5 overflow-x-auto no-scrollbar">
                        {['홍대에서 가볼 만한 곳 추천해 줘', '나는 지금 대구에 있어. 여행 코스를 짜줘', '근처에 화장실이 어디 있어?'].map((q) => (
                          <button key={q} onClick={() => handleSendChat(q)} className="px-3 py-1.5 rounded-full bg-white border border-indigo-100 text-[10px] font-extrabold text-indigo-700 whitespace-nowrap">
                            {q}
                          </button>
                        ))}
                      </div>

                      <div className="space-y-3 max-h-80 overflow-y-auto">
                        {chatMessages.map((msg, i) => (
                          <div key={i} className={`flex items-start gap-2 ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                            {msg.sender === 'ai' && (
                              <div className="w-8 h-8 rounded-full overflow-hidden shadow-md border-2 border-indigo-200 bg-[#5B21B6] flex items-center justify-center shrink-0">
                                <WelKomeAppIcon size={32} />
                              </div>
                            )}
                            <div className={`max-w-[80%] rounded-2xl px-3.5 py-2.5 text-xs ${msg.sender === 'user' ? 'bg-[#4F46E5] text-white font-semibold' : 'bg-white text-slate-800 border border-slate-100'}`}>
                              {msg.sender === 'ai' && <p className="text-[10px] font-black text-indigo-600 mb-0.5">welKome AI 챗봇</p>}
                              {msg.text}
                            </div>
                          </div>
                        ))}
                      </div>

                      <div className="flex items-center gap-2 pt-2">
                        <input
                          type="text"
                          value={chatInput}
                          onChange={(e) => setChatInput(e.target.value)}
                          onKeyDown={(e) => e.key === 'Enter' && handleSendChat()}
                          placeholder={t.aiPlaceholder}
                          className="flex-1 bg-white border border-slate-200 rounded-2xl px-3.5 py-2.5 text-xs"
                        />
                        <button onClick={() => handleSendChat()} className="p-2.5 rounded-2xl bg-[#4F46E5] text-white">
                          <LucideIcon name="Send" />
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* AI GLASSES TAB */}
                {activeTab === 'glasses' && (
                  <div className="pb-24 bg-[#F5F6FC] min-h-full">
                    <div className="bg-gradient-to-br from-[#191347] via-[#2A1F73] to-[#4F46E5] text-white px-4 pt-4 pb-5 rounded-b-3xl shadow-lg">
                      <div className="flex items-center justify-between">
                        <div>
                          <h2 className="text-base font-black">AI 스마트 안경</h2>
                          <span className="text-[10px] font-extrabold text-emerald-300">{glassesConnected ? '● BLE + HUD 실시간 연결됨' : '○ 연결 대기 중'}</span>
                        </div>
                        <button onClick={() => setGlassesConnected(!glassesConnected)} className="px-3 py-1.5 rounded-full bg-white text-[#1E1B4B] text-[11px] font-extrabold">
                          {glassesConnected ? '연결 해제' : '안경 연결'}
                        </button>
                      </div>
                    </div>
                    <div className="p-4 space-y-3">
                      <div className="relative h-48 rounded-3xl overflow-hidden border-2 border-indigo-400/40 bg-slate-950">
                        <SafePhoto src={mapDestination.photo || REAL_PHOTOS.gyeongbokgung} alt="HUD" className="w-full h-full object-cover brightness-90" />
                        <div className="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-transparent to-slate-950/60" />
                        <div className="absolute top-3 left-3 right-3 bg-indigo-950/85 border border-cyan-300/50 rounded-2xl p-2.5 text-white">
                          <p className="text-[9px] font-extrabold text-cyan-300">AR 길찾기 동기화 · HUD {glassesBrightness}%</p>
                          <p className="text-xs font-black mt-0.5">{(mapDestination.arWaypoints || ATTRACTIONS[0].arWaypoints)[0].instruction}</p>
                        </div>
                        <div className="absolute bottom-3 left-3 right-3 bg-black/80 border border-cyan-300/40 rounded-xl px-3 py-2 text-white">
                          <p className="text-[9px] font-extrabold text-cyan-300">AI 챗봇 실시간 안경 자막</p>
                          <p className="text-[11px] truncate">{glassesHudPrompt}</p>
                        </div>
                      </div>

                      <div className="bg-white rounded-2xl p-3.5 space-y-2">
                        <p className="text-xs font-black text-[#1E1B4B]">AI 챗봇 질문 → 안경 자막/음성 전송</p>
                        <div className="flex gap-1.5">
                          <input
                            type="text"
                            value={glassesQuickInput}
                            onChange={(e) => setGlassesQuickInput(e.target.value)}
                            placeholder="홍대 추천, 메뉴 번역..."
                            className="flex-1 px-3 py-2 rounded-xl bg-slate-100 text-xs"
                          />
                          <button
                            onClick={() => {
                              if (!glassesQuickInput.trim()) return;
                              const rep = buildAiReply(glassesQuickInput);
                              setGlassesHudPrompt(rep);
                              speakPhrase(rep);
                              setGlassesQuickInput('');
                            }}
                            className="px-3.5 py-2 rounded-xl bg-[#4F46E5] text-white text-xs font-extrabold"
                          >
                            전송
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* MY PAGE TAB */}
                {activeTab === 'mypage' && (
                  <div className="pb-24 bg-[#F5F6FC] min-h-full">
                    <div className="bg-gradient-to-br from-[#2E1A78] to-[#4F46E5] text-white px-4 pt-5 pb-6 rounded-b-3xl">
                      <div className="flex items-center gap-3">
                        <WelKomeAppIcon size={44} />
                        <div>
                          <input value={nickname} onChange={(e) => setNickname(e.target.value)} className="bg-transparent border-b border-white/30 text-base font-black text-white focus:outline-none" />
                          <p className="text-[11px] text-indigo-200 mt-1">{nationality} · {selectedRegion} Explorer</p>
                        </div>
                      </div>
                    </div>
                    <div className="p-4 space-y-3">
                      <div className="bg-white rounded-2xl p-3.5 space-y-2">
                        <h3 className="text-xs font-black text-[#1E1B4B]">Q&A · Smart Tourism Help Center</h3>
                        {FAQ_ITEMS.map((item, idx) => (
                          <div key={idx} className="border border-slate-100 rounded-xl overflow-hidden">
                            <button onClick={() => setOpenFaqIdx(openFaqIdx === idx ? -1 : idx)} className="w-full p-2.5 bg-slate-50 text-left text-[11px] font-extrabold text-slate-800">
                              {item.q}
                            </button>
                            {openFaqIdx === idx && <p className="p-2.5 text-[11px] text-slate-600 bg-white">{item.a}</p>}
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>

              {/* BOTTOM 6-TAB NAVIGATION BAR */}
              <nav className="bg-white/95 border-t border-slate-100 px-1 py-2 grid grid-cols-6 items-center shrink-0 z-30">
                {[
                  { id: 'home', label: t.navHome, icon: 'Landmark' },
                  { id: 'map', label: t.navMap, icon: 'MapPin' },
                  { id: 'culture', label: t.navCulture, icon: 'Sparkles' },
                  { id: 'chat', label: t.navChat, icon: 'MessageCircle' },
                  { id: 'glasses', label: t.navGlasses, icon: 'Glasses' },
                  { id: 'mypage', label: t.navMyPage, icon: 'User' },
                ].map((nav) => {
                  const isActive = activeTab === nav.id;
                  return (
                    <button
                      key={nav.id}
                      onClick={() => { setSelectedAttraction(null); setActiveTab(nav.id); }}
                      className={`flex flex-col items-center justify-center py-1 rounded-xl ${isActive ? 'text-[#4F46E5]' : 'text-slate-400'}`}
                    >
                      <div className={`p-1.5 rounded-xl ${isActive ? 'bg-indigo-50' : ''}`}>
                        <LucideIcon name={nav.icon} className="w-4 h-4" />
                      </div>
                      <span className="text-[9px] font-extrabold mt-0.5 truncate max-w-full px-0.5">{nav.label}</span>
                    </button>
                  );
                })}
              </nav>
            </div>
          )}

          {/* KIOSK MODE */}
          {platformMode === 'kiosk' && (
            <div className="w-full max-w-4xl bg-white rounded-3xl shadow-2xl border-4 border-indigo-900/15 overflow-hidden">
              <div className="bg-gradient-to-r from-[#1E1B4B] to-[#4F46E5] text-white p-5 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <WelKomeAppIcon size={44} />
                  <div>
                    <WelKomeWordmark size="text-2xl" />
                    <p className="text-xs text-indigo-200">TOURISM KIOSK #04 · GWANGHWAMUN</p>
                  </div>
                </div>
              </div>
              <div className="grid md:grid-cols-3 gap-5 p-6 bg-slate-50">
                <div className="md:col-span-2 space-y-3">
                  <h3 className="text-sm font-black text-[#1E1B4B]">1. Select Destination</h3>
                  <div className="grid sm:grid-cols-2 gap-3">
                    {ATTRACTIONS.map((spot) => (
                      <button
                        key={spot.id}
                        onClick={() => { setKioskSelectedSpot(spot); setScenarioStep(3); }}
                        className={`p-3 rounded-2xl border-2 text-left flex items-center gap-3 ${kioskSelectedSpot.id === spot.id ? 'border-[#4F46E5] bg-indigo-50' : 'border-slate-200 bg-white'}`}
                      >
                        <SafePhoto src={spot.photo} alt={spot.name.en} className="w-14 h-14 rounded-xl object-cover" />
                        <div>
                          <p className="text-sm font-black text-[#1E1B4B]">{spot.name[lang] || spot.name.en}</p>
                          <p className="text-xs text-slate-500">{spot.distance} · {spot.walkTime}</p>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>
                <div className="bg-white rounded-3xl p-5 border border-indigo-100 text-center space-y-4">
                  <h4 className="text-base font-black text-[#1E1B4B]">{kioskSelectedSpot.name[lang] || kioskSelectedSpot.name.en}</h4>
                  <div className="p-4 rounded-3xl bg-indigo-50 inline-block">
                    <LucideIcon name="QrCode" className="w-24 h-24 text-[#1E1B4B]" />
                  </div>
                  <button
                    onClick={() => { setQrSyncedToast(`키오스크 QR 경로 전송 완료: ${kioskSelectedSpot.name.ko}`); setTimeout(() => setQrSyncedToast(null), 3500); openInMap(kioskSelectedSpot, true, 5); }}
                    className="w-full py-3 rounded-2xl bg-[#4F46E5] text-white text-xs font-black"
                  >
                    Simulate QR Scan → Open in Mobile App
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* QR LANDMARK MODE */}
          {platformMode === 'qr' && (
            <div className="w-full max-w-2xl bg-white rounded-3xl shadow-2xl border border-indigo-100 overflow-hidden">
              <div className="relative h-48">
                <SafePhoto src={qrLandmarkSpot.photo} alt={qrLandmarkSpot.name.en} className="w-full h-full object-cover" />
                <div className="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-transparent to-transparent" />
                <div className="absolute bottom-4 left-4 text-white">
                  <h2 className="text-2xl font-black">{qrLandmarkSpot.name[lang] || qrLandmarkSpot.name.en}</h2>
                  <p className="text-xs text-slate-200">{qrLandmarkSpot.address}</p>
                </div>
              </div>
              <div className="p-5 space-y-3">
                <div className="flex gap-1.5 overflow-x-auto no-scrollbar">
                  {ATTRACTIONS.map((sp) => (
                    <button key={sp.id} onClick={() => setQrLandmarkSpot(sp)} className={`px-3 py-1.5 rounded-full text-xs font-extrabold ${qrLandmarkSpot.id === sp.id ? 'bg-[#4F46E5] text-white' : 'bg-slate-100 text-slate-700'}`}>
                      QR: {sp.name[lang] || sp.name.en}
                    </button>
                  ))}
                </div>
                <p className="text-xs text-slate-700 bg-indigo-50/70 p-4 rounded-2xl">{qrLandmarkSpot.summary[lang] || qrLandmarkSpot.summary.en}</p>
                <p className="text-xs text-purple-900 bg-purple-50 p-3.5 rounded-2xl">🎬 {qrLandmarkSpot.kContent}</p>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
